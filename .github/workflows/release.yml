name: release

# v* のタグを push するか、Actions から手動実行 (タグ名を入力) すると、ビルドして
# バイナリと SHA256SUMS を GitHub Release に添付する。
# NNDD-RE 本体は、このリリースのバージョンとハッシュを本体側に埋め込んで (ピン留めして) 取得する。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースのタグ (例: v0.1.1)。main の最新コミットから作る'
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: check tag
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "タグ名が不正です: ${TAG} (例: v0.1.1)"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          VERSION="${TAG#v}"
          for t in linux/amd64 windows/amd64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/nndd-re-tailscale-${os}-${arch}${ext}" .
          done
          cp THIRD_PARTY_NOTICES.md LICENSE dist/
          (cd dist && sha256sum nndd-re-tailscale-* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --prerelease \
            --notes "NNDD-RE 用 Tailscale サイドカー ${TAG}。\`SHA256SUMS\` でバイナリを検証できます。"
